[package]
name = "kintsugi-ingest"
description = "Kintsugi's ingestion engine: source adapters that turn anything into normalized Markdown items"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Readability port with Markdown output (MIT).
dom_smoothie = "0.19"
dom_query = { version = "0.29", features = ["markdown"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
tokio = { version = "1.54.1", features = ["time", "fs", "process", "io-util", "sync", "macros"] }
feed-rs = "3"
# Optional tools, transcripts and podcast feeds (KI-34).
sha2 = "0.10"
hex = "0.4"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.21"
tempfile.workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["time", "rt", "net", "fs", "process", "io-util", "sync", "macros"] }
