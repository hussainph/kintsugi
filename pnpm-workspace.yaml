  "@codemirror/language-data": ^6.5.2
  "@codemirror/search": ^6.7.2
  "@codemirror/state": ^6.7.6
  "@codemirror/view": ^6.43.15
  "@lezer/highlight": ^1.2.5
  "@tailwindcss/vite": ^4.3.3
  "@tauri-apps/api": ^2
  "@tauri-apps/cli": ^2
  "@types/node": ^26.6.6
  "@types/react": ^19.1.8
  "@types/react-dom": ^19.1.6
  "@vitejs/plugin-react": ^6.0.2
  lucide-react: ^1.63.0
  react: ^19.1.0
  react-dom: ^19.1.0
  sonner: ^2.0.8
