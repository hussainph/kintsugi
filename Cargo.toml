[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/vault", "crates/ingest", "crates/search", "crates/rank"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hussain Phalasiya"]

[workspace.dependencies]
kintsugi-vault = { path = "crates/vault" }
kintsugi-ingest = { path = "crates/ingest" }
kintsugi-search = { path = "crates/search" }
kintsugi-rank = { path = "crates/rank" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

# Debug builds: line tables for our own crates (readable backtraces), no
# debug info for dependencies. Full debug info for ~800 crates made every
# worktree's target/ 10+ GB; this keeps builds and tests the same otherwise.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc macros and build scripts run on this machine during the build; Xcode
# 27's `strip` leaves their dylibs unloadable ("mis-aligned LINKEDIT"), so
# only the shipped binary is stripped.
[profile.release.build-override]
strip = false
