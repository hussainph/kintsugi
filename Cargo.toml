[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/vault", "crates/ingest", "crates/search"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hussain Phalasiya"]

[workspace.dependencies]
kintsugi-vault = { path = "crates/vault" }
kintsugi-ingest = { path = "crates/ingest" }
kintsugi-search = { path = "crates/search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc macros and build scripts run on this machine during the build; Xcode
# 27's `strip` leaves their dylibs unloadable ("mis-aligned LINKEDIT"), so
# only the shipped binary is stripped.
[profile.release.build-override]
strip = false
