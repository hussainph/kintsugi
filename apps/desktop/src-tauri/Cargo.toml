[package]
name = "kintsugi"
description = "A writing app where your words stay at the center"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kintsugi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["native"]
native = ["tauri/wry", "tauri/compression", "tauri/dynamic-acl", "tauri/x11", "tauri/dbus", "tauri/common-controls-v6"]
# Debug-only; use --no-default-features so no OS runtime is even linked.
headless = ["tauri/test", "tauri/unstable"]

[dependencies]
tauri = { version = "2", default-features = false, features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2"
# Compiled everywhere so the capability ACL knows their permissions; only the
# native builder registers them, so headless runs never update or relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
trash = "5.2.9"
tokio = { version = "1.54.1", features = ["time", "sync", "rt", "net"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
kintsugi-vault.workspace = true
kintsugi-ingest.workspace = true
kintsugi-search.workspace = true
kintsugi-rank.workspace = true
libc = "0.2"
futures-util = "0.3.34"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "form"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.41", features = ["bundled"] }
quick-xml = "0.42"
uuid = { version = "1", features = ["v4"] }
# PDF export: Typst typesets pieces in-process with its bundled fonts, the
# same in the native app and headless runs (see docs/export.md).
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }

[dev-dependencies]
tempfile.workspace = true
