# KI-21's capture harness: runs the real ingest adapters against a scratch
# vault under .headless and prints what each clip became. Standalone (not a
# workspace member) so the product's build never sees it.
[package]
name = "lab-clip-capture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
kintsugi-ingest = { path = "../../../../../../crates/ingest" }
kintsugi-vault = { path = "../../../../../../crates/vault" }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
