# Headless acceptance fixture for the iOS share extension (KI-2).
#
# Generated into apps/mobile/.expo/share-acceptance/project by run.sh; nothing
# here is part of the app and nothing here is ever added to apps/mobile/ios,
# which stays generated by plugins/with-capture.js.
#
#   ShareHarness         a plain UIKit app with three share buttons. It has no
#                        App Group and no keychain, so a capture can only have
#                        been written by the real installed Kintsugi extension.
#   ShareHarnessUITests  XCTest UI tests that open the system share sheet, pick
#                        the installed Kintsugi extension, type a note and Save.
#
# Paths are relative to this spec file (apps/mobile/share/acceptance).
name: ShareHarness
options:
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: "YES"
    # No team, no profile: the simulator ad-hoc signs. Neither target asks for
    # an entitlement, and that is deliberate (see the header above).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ShareHarness:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phalasiya.kintsugi.shareharness
        PRODUCT_NAME: ShareHarness
        TARGETED_DEVICE_FAMILY: "1"
        # The Info.plist is generated by the toolchain, so no plist path has to
        # resolve between this directory and the generated project's SRCROOT.
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: ShareHarness
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  ShareHarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: ShareHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.phalasiya.kintsugi.shareharness.uitests
        # The runner bundle needs its own Info.plist; CI-generated is fine.
        GENERATE_INFOPLIST_FILE: "YES"
        # The app the runner drives by default; the tests still launch it by id.
        TEST_TARGET_NAME: ShareHarness
schemes:
  ShareHarness:
    build:
      targets:
        ShareHarness: all
        ShareHarnessUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        KI2_BASE_URL: ${KI2_BASE_URL}
      targets:
        - ShareHarnessUITests
      # One simulator, one runner: shares and App Group writes must not overlap.
      parallelizable: false
      gatherCoverageData: false
